[project]
name = "sensorstreamer"
version = "0.1.0"
description = "Receiver and live viewer for the SensorStreamer watchOS app: raw audio and IMU from an Apple Watch over UDP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pyglet>=2.1",
]

[project.scripts]
sensorstreamer-receive = "sensorstreamer.receive:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sensorstreamer"]
