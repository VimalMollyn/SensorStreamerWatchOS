# xcodegen spec for the watch app. `xcodegen generate` (or scripts/build_watch.sh)
# writes SensorStreamer.xcodeproj from this; the project file is not checked in.
name: SensorStreamer
options:
  bundleIdPrefix: com.figlab
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 2GMYQHF932
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  SensorStreamer:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: SensorStreamer
    info:
      path: SensorStreamer/Info.plist
      properties:
        CFBundleDisplayName: SensorStreamer
        WKApplication: true
        WKWatchOnly: true
        UIBackgroundModes: [audio]
        WKBackgroundModes: [mindfulness]
        NSMicrophoneUsageDescription: Streams the microphones to a computer on this network
        NSLocalNetworkUsageDescription: Streams audio and motion data to a computer on this network
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.figlab.sensorstreamer
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
schemes:
  SensorStreamer:
    build:
      targets:
        SensorStreamer: all
    run:
      config: Debug
